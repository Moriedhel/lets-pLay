spring.application.name=lets-play

# MongoDB connection (local instance)
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=letsplay
# Required for @Indexed(unique = true) on User.username/email to actually be enforced
spring.data.mongodb.auto-index-creation=true

# JWT (dev only - override with env vars JWT_SECRET / JWT_EXPIRATION_MS in real environments)
jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-must-be-at-least-32-bytes-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# HTTPS (dev only - self-signed keystore generated locally, never commit the real file)
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:file:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=letsplay

# Default admin account bootstrapped on startup if it doesn't exist yet (dev only - override in real environments)
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@letsplay.local}
admin.password=${ADMIN_PASSWORD:change-this-dev-only-admin-password}

